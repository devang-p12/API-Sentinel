# ==============================================================================
# Render Blueprint Specification (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. API Sentinel Backend (NestJS + BullMQ + k6 Load Testing)
  # ----------------------------------------------------------------------------
  - type: web
    name: sentinel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter # Starter ($7/mo) recommended so monitoring workers stay active 24/7
    region: oregon
    healthCheckPath: /api/v1/projects
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false # Set to your Redis URL (Render Redis or free Upstash Redis)
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: K6_BIN_PATH
        value: /usr/local/bin/k6
      - key: API_TEST_MAX_TIMEOUT_MS
        value: 30000
      - key: API_TEST_MAX_RESPONSE_SIZE
        value: 10485760
      - key: API_TESTER_ALLOW_PRIVATE_IPS
        value: "true"

  # ----------------------------------------------------------------------------
  # 2. API Sentinel Frontend (React + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: static
    name: sentinel-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sentinel-backend
          property: host

databases:
  # ----------------------------------------------------------------------------
  # 3. PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: sentinel-postgres
    databaseName: sentinel_db
    user: sentinel
    plan: starter # Or free tier
    region: oregon
