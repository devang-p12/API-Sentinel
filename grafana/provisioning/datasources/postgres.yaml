apiVersion: 1

datasources:
  - name: PostgreSQL (Sentinel DB)
    type: postgres
    access: proxy
    url: postgres:5432
    user: sentinel
    secureJsonData:
      password: sentinel_password
    jsonData:
      database: sentinel_db
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
