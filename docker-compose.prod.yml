services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_password}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_password}@postgres:5432/${POSTGRES_DB:-sentinel_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      LOAD_TEST_MAX_VUS: ${LOAD_TEST_MAX_VUS:-500}
      LOAD_TEST_MAX_DURATION: ${LOAD_TEST_MAX_DURATION:-3600}
      LOAD_TEST_MAX_REQUESTS: ${LOAD_TEST_MAX_REQUESTS:-1000000}
      LOAD_TEST_WORKER_CONCURRENCY: ${LOAD_TEST_WORKER_CONCURRENCY:-2}
      K6_BIN_PATH: /usr/local/bin/k6
      API_TEST_MAX_TIMEOUT_MS: ${API_TEST_MAX_TIMEOUT_MS:-30000}
      API_TEST_MAX_RESPONSE_SIZE: ${API_TEST_MAX_RESPONSE_SIZE:-10485760}
      API_TESTER_ALLOW_PRIVATE_IPS: ${API_TESTER_ALLOW_PRIVATE_IPS:-true}
    networks:
      - sentinel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${SENTINEL_PORT:-80}:80"
    networks:
      - sentinel-net

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  sentinel-net:
    driver: bridge
